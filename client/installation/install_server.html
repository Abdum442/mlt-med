<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Server Directory</title>
  <style>
    body {
      font-family: Arial;
      padding: 5px 20px;
    }

    * {
      box-sizing: border-box;
    }

    .example {
      background-color: #fefefe;
      margin: 5% auto 5% auto;
      /* 5% from the top, 15% from the bottom and centered */
    }

    .heading {
      text-align: left;
      margin: 24px 0 12px 0;
      position: relative;
    }

    form.example input[type=text] {
      padding: 10px;
      font-size: 17px;
      border: 0px solid grey;
      float: left;
      width: 70%;
      background: #f1f1f1;
    }

    form.example button {
      float: left;
      width: 20%;
      padding: 10px;
      background: #2196F3;
      color: white;
      font-size: 17px;
      border: 1px solid grey;
      border-radius: 5px;
      cursor: pointer;
    }

    form.example button:hover {
      background: #0b7dda;
    }

    form.example::after {
      content: "";
      clear: both;
      display: table;
    }

    /* The Close Button (x) */
    .close {
      position: absolute;
      right: 25px;
      top: 0;
      color: #000;
      font-size: 35px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: red;
      cursor: pointer;
    }
    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background-color: #f1f1f1;
    }
    .footer div {
      float: right;
      padding: 14px 16px;
    }
    .cancel .next {
      padding: 16px 32px;
      text-align: center;
      font-size: 16px;
      margin: 4px 2px;
      border-radius: 5px;
      opacity: 1;
      transition: 0.3s;
    }
  </style>
</head>

<body>


<h3 id="title">Select a directory for database server</h3>

  <form class="example">

    <div class="container">
      <button type="button" id="browseBtn">Browse</button>
      <input type="text" id="selectdDirectory" placeholder="Search.." name="search">
    </div>

  </form>
<div class="footer">
  <div type="button" class="next" id="nextBtn"><button>Next</button></div>
  <div type="button" class="cancel" id="cancelBtn"><button>Cancel</button></div>
</div>
<div id="data-log">

</div>

<script type="module" src="docker_compose.js"></script>
</body>

</html>
